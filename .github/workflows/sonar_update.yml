name: Sonar Auto Update (Every 3 Days 06:00 JST)

on:
  schedule:
    - cron: '0 21 */3 * *'
  workflow_dispatch:

concurrency:
  group: sonar-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  observe:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6 / Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 / Node 24
        with:
          python-version: "3.14.9"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt
      - name: Collect public GitHub observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.cli run
      - run: python build_site.py
      - run: python scripts/pre_deploy_check.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 / Node 24
        with:
          name: sonar-generated
          path: |
            data/sonar.jsonl
            dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: observe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6 / Node 24
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 / Node 24
        with:
          name: sonar-generated
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 / Node 24
        with:
          node-version: "24.22.1"
      - run: npm ci
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'aba4ac3abdccd69448f4d2ef251cae10' }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx --no-install wrangler pages deploy dist --project-name sonar --commit-dirty=true
          else
            echo "Cloudflare token is not set; Pages deployment skipped."
          fi

  persist:
    needs: [observe, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6 / Node 24
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 / Node 24
        with:
          name: sonar-generated
      - name: Commit observations without overwriting concurrent changes
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "カイ様"
          git config user.email "kai@antigravity"
          git add data/sonar.jsonl
          if ! git diff --staged --quiet; then
            git commit -m "chore(sonar): 3日次自動更新 [skip ci]"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
